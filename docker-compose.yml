services:
  drupal:
    build: .
    ports:
      - "8089:80"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-squ_website}
      DB_USER: ${POSTGRES_USER:-squ_user}
      DB_PASS: ${POSTGRES_PASSWORD:-squ_pass}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-change-this-to-a-long-random-string-before-any-real-use}
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squ_website}
      POSTGRES_USER: ${POSTGRES_USER:-squ_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squ_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squ_user} -d ${POSTGRES_DB:-squ_website}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  drupal_files:
  db_data:
